<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos de una cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light py-4">
    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h1 class="text-center mb-4">Gestión de pedidos de una cafetería</h1>

                <div id="idAlerta"></div>

                <form id="idFormularioPedido" class="row g-3 mb-4" novalidate>
                    <div class="col-md-4">
                        <label for="idProducto" class="form-label">Nombre del producto</label>
                        <input type="text" id="idProducto" class="form-control" placeholder="Ej. Café americano" required />
                    </div>
                    <div class="col-md-4">
                        <label for="idPrecio" class="form-label">Precio unitario ($)</label>
                        <input type="number" id="idPrecio" class="form-control" step="0.01" min="0.01" placeholder="Ej. 2.50" required />
                    </div>
                    <div class="col-md-4">
                        <label for="idCantidad" class="form-label">Cantidad solicitada</label>
                        <input type="number" id="idCantidad" class="form-control" step="1" min="1" placeholder="Ej. 3" required />
                    </div>
                    <div class="col-12">
                        <button type="button" id="idBtnAgregar" class="btn btn-primary">Agregar pedido</button>
                    </div>
                </form>

                <hr />

                <div class="row g-3 align-items-end mb-4">
                    <div class="col-md-4">
                        <label for="idPrecioMaximo" class="form-label">Precio máximo ($)</label>
                        <input type="number" id="idPrecioMaximo" class="form-control" step="0.01" min="0.01" placeholder="Ingrese precio máximo" />
                    </div>
                    <div class="col-md-8 d-flex gap-2 flex-wrap">
                        <button type="button" id="idBtnFiltrar" class="btn btn-secondary">Filtrar productos</button>
                        <button type="button" id="idBtnMostrarTodos" class="btn btn-info text-white">Mostrar todos</button>
                        <button type="button" id="idBtnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <thead class="table-success">
                            <tr>
                                <th scope="col">Producto</th>
                                <th scope="col">Precio unitario</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="idTablaPedidos"></tbody>
                    </table>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="p-3 bg-white border rounded">
                            <strong>Total de unidades solicitadas:</strong> <span id="idTotalUnidades">0</span>
                        </div>
                    </div>
                    <div class="col-md-6 mt-2 mt-md-0">
                        <div class="p-3 bg-white border rounded">
                            <strong>Monto total de los pedidos:</strong> <span id="idMontoTotal">$0.00</span>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <a href="../index.html" class="btn btn-primary w-100">Regresar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
